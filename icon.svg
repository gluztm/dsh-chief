<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="DSH Chief">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="55%" stop-color="#14244B"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="52%">
      <stop offset="0%" stop-color="#FFE033" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFE033" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF394"/>
      <stop offset="45%" stop-color="#FFE033"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE033" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#glow)"/>
  <rect x="9.5" y="9.5" width="109" height="109" rx="26.5" fill="none" stroke="url(#rim)" stroke-width="2.5"/>

  <!-- Subtle tactical arc -->
  <path d="M28 52 A38 38 0 0 1 100 52" fill="none" stroke="#38BDF8" stroke-opacity="0.24" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>

  <!-- Command DAG links from Chief Star to 3 execution nodes -->
  <g stroke-width="3.2" stroke-linecap="round" fill="none">
    <path d="M64 48 L34 84" stroke="#38BDF8" stroke-opacity="0.85"/>
    <path d="M64 48 L64 88" stroke="#FFE033" stroke-opacity="0.9"/>
    <path d="M64 48 L94 84" stroke="#34D399" stroke-opacity="0.85"/>
    <path d="M34 84 L64 88 L94 84" stroke="#94A3B8" stroke-opacity="0.32" stroke-width="2"/>
  </g>

  <!-- Subagent / Archive tier nodes -->
  <circle cx="34" cy="84" r="8.5" fill="#0F172A" stroke="#38BDF8" stroke-width="3.2"/>
  <circle cx="34" cy="84" r="3.2" fill="#38BDF8"/>

  <rect x="55" y="79" width="18" height="18" rx="5" fill="#0F172A" stroke="#FFE033" stroke-width="3.2"/>
  <circle cx="64" cy="88" r="3.4" fill="#FFE033"/>

  <circle cx="94" cy="84" r="8.5" fill="#0F172A" stroke="#34D399" stroke-width="3.2"/>
  <circle cx="94" cy="84" r="3.2" fill="#34D399"/>

  <!-- Sovereign Chief 4-point Command Star -->
  <path d="M64 20 L70.2 35.8 L86 42 L70.2 48.2 L64 64 L57.8 48.2 L42 42 L57.8 35.8 Z" fill="url(#gold)"/>
  <circle cx="64" cy="42" r="4.2" fill="#FFFFFF" fill-opacity="0.92"/>
</svg>
