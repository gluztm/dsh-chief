name: Publish dsh-chief to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 (npm OIDC ready)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify syntax and package manifest
        run: |
          node --version
          npm --version
          for f in *.js; do node --check "$f"; done
          npm pack --dry-run

      - name: Publish to npm via OIDC Trusted Publishing
        run: |
          unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          rm -f ~/.npmrc
          npm publish --provenance --access public
