name: Publish dsh-chief to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 (npm OIDC ready)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run CI verification gates and check tarball
        run: |
          node --version
          npm --version
          npm run test:ci
          npm pack --dry-run

      - name: Publish to npm via OIDC Trusted Publishing
        run: |
          unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          rm -f ~/.npmrc
          LOCAL_VER=$(node -p "require('./package.json').version")
          REMOTE_VER=$(npm view dsh-chief version 2>/dev/null || echo "")
          if [ "$LOCAL_VER" = "$REMOTE_VER" ]; then
            echo "dsh-chief@$LOCAL_VER is already published on npm; skipping duplicate publish."
            exit 0
          fi
          npm publish --provenance --access public
