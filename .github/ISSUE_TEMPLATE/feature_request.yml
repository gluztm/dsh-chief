name: ✨ 功能建议 (Feature Request)
description: 建议新功能或改进面板交互、任务跟踪、档案管理与拦截规则
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与痛点 (Problem / Use Case)
      description: 平时用 DSH 时遇到了什么卡点或不顺手的地方？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案 (Proposed Solution)
      description: 你希望面板怎么帮你处理，或者长成什么样？
    validations:
      required: true
