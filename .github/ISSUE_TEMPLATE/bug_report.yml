name: 🐛 Bug 反馈 (Bug Report)
description: 报告 DSH 参谋长 (dsh-chief) 在运行、渲染或模型调用中的异常问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供复现步骤与环境版本（请勿粘贴任何真实 API Key 或私密路径）。
  - type: input
    id: versions
    attributes:
      label: 环境版本 (Environment)
      description: 操作系统、DSH 版本与 dsh-chief 版本
      placeholder: "Windows 11 / DSH 0.2.x / dsh-chief 1.0.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 (Steps to Reproduce)
      description: 如何触发该问题？涉及哪个页签（参谋 / 任务 / 协同 / 规划 / 档案 / 边界）？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为与实际表现 (Expected vs Actual)
    validations:
      required: true
